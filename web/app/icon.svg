<!--
  The favicon and the in-app wordmark are the same glyph: lucide `Waypoints`
  (modules/shared/auth-value.tsx) — a routed path with direction nodes. That
  mark was never a lens or an eye, which is why the brand work in bs-pumdwuri
  changed the words and left the mark alone.

  The two colours are the compiled values of `--primary` and `--background`
  (web/app/globals.css). A static SVG served from /icon.svg has no stylesheet
  and cannot read a custom property, so they are literal here — the one place
  in this codebase where that is true. Change a token, change these.

  Path data is copied verbatim from lucide-react 1.18.0 (icons/waypoints.mjs),
  translated by 4 to centre a 24px glyph in a 32px tile.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8" fill="#0A0E12"/>
  <g transform="translate(4 4)" fill="none" stroke="#22c786" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m10.586 5.414-5.172 5.172"/>
    <path d="m18.586 13.414-5.172 5.172"/>
    <path d="M6 12h12"/>
    <circle cx="12" cy="20" r="2"/>
    <circle cx="12" cy="4" r="2"/>
    <circle cx="20" cy="12" r="2"/>
    <circle cx="4" cy="12" r="2"/>
  </g>
</svg>
