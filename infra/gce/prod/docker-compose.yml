name: agentray-prod

# Blue-green: the service body lives in an anchor and is instantiated twice,
# once per colour. A deploy starts the colour that is NOT serving, waits for it
# to report healthy, then flips the Caddy upstream snippet — so a broken build
# never sees a request and "rollback" is just not flipping. Only one colour
# exists at a time; infra/gce/lib/blue-green.sh removes the old one after the
# switch. Never `up -d` without naming a service, or you start both.
x-agentray-api: &agentray-api-svc
  image: asia-southeast1-docker.pkg.dev/lohi-dev-lohi/docker/agentray-api:${AGENTRAY_TAG:-latest-prod}
  restart: unless-stopped
  env_file:
    - app.env
    - secret.env
  mem_limit: 384m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - edge
  healthcheck:
    # /readyz, not /healthz: the deploy gate must wait for this colour to have
    # applied the whole durable stream (events AND connector rows) before Caddy
    # is pointed at it — a colour still replaying would serve stale data behind
    # a static 200. /healthz stays the static-200 liveness answer for everything
    # else.
    #
    # This window and the deploy's --gate-timeout are two timers, not one.
    # Docker reports `starting` through start_period and `unhealthy` after
    # `retries` consecutive failures, i.e. start_period + interval × retries =
    # 330s here; bg_wait treats `unhealthy` as TERMINAL (it removes the new
    # colour rather than waiting the deadline out, which is what keeps a
    # genuinely broken colour from burning the whole gate). So a replay that
    # outlives 330s must be met by widening THIS window too, not only by
    # `--gate-timeout`: raise retries to cover the wait, or accept the refusal
    # — it is safe, the old colour keeps serving — and see deploy.sh's header
    # for the rest. The declared window must stay above the default
    # GATE_TIMEOUT (240s) so an ordinary deploy is decided by the gate and not
    # by Docker.
    #
    # One passing probe is all the gate needs and one failing probe is not a
    # verdict: Docker marks the container healthy on the first probe that
    # succeeds, and a busy process can answer 503 while it cannot read the broker
    # (those reads are bounded) before the next probe clears it. What the window
    # has to outlast is the REPLAY, because a colour that has not caught up
    # refuses every probe.
    test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/readyz"]
    interval: 30s
    timeout: 5s
    retries: 10
    start_period: 30s

x-agentray-web: &agentray-web-svc
  image: asia-southeast1-docker.pkg.dev/lohi-dev-lohi/docker/agentray-web:${AGENTRAY_TAG:-latest-prod}
  restart: unless-stopped
  mem_limit: 384m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - edge

services:
  # DuckDB is a single-writer embedded database, so each colour owns its own
  # file on its own volume — a shared file would lock out the incoming colour
  # and a shared volume would corrupt it. Each colour also gets its own
  # JetStream durable (INGEST_DURABLE), and BOTH subjects on the ingest stream —
  # event batches and connector sync batches — are filtered by that one durable,
  # so both colours receive every row while both run and a fresh colour replays
  # the stream's retention window on first boot. That is also why the healthcheck
  # above waits for /readyz: until the replay covers the stream head, the colour
  # is missing rows it would answer queries from.
  agentray-api-blue:
    <<: *agentray-api-svc
    container_name: prod-agentray-api-blue
    environment:
      DUCKDB_PATH: /data/agentray.duckdb
      INGEST_DURABLE: agentray-ingestors-prod-blue
    volumes:
      - duckdb-prod-blue:/data

  agentray-api-green:
    <<: *agentray-api-svc
    container_name: prod-agentray-api-green
    environment:
      DUCKDB_PATH: /data/agentray.duckdb
      INGEST_DURABLE: agentray-ingestors-prod-green
    volumes:
      - duckdb-prod-green:/data

  agentray-web-blue:
    <<: *agentray-web-svc
    container_name: prod-agentray-web-blue

  agentray-web-green:
    <<: *agentray-web-svc
    container_name: prod-agentray-web-green

volumes:
  duckdb-prod-blue:
  duckdb-prod-green:

networks:
  edge:
    external: true
