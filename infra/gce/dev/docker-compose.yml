name: agentray-dev

# Blue-green: the service body lives in an anchor and is instantiated twice,
# once per colour. A deploy starts the colour that is NOT serving, waits for it
# to report healthy, then flips the Caddy upstream snippet — so a broken build
# never sees a request and "rollback" is just not flipping. Only one colour
# exists at a time; infra/gce/lib/blue-green.sh removes the old one after the
# switch. Never `up -d` without naming a service, or you start both.
x-agentray-api: &agentray-api-svc
  image: asia-southeast1-docker.pkg.dev/lohi-dev-lohi/docker/agentray-api:${AGENTRAY_TAG:-latest-dev}
  restart: unless-stopped
  env_file:
    - app.env
    - secret.env
  # 1024m is the api's half of the sandbox envelope (duckdb_sandbox.go): the
  # GOMEMLIMIT declared per colour below (256 MiB), the trusted DuckDB instance
  # (128 MB), two sandbox children at their measured 192 MiB address-space
  # budget plus 32 MiB of runtime each, and a 96 MiB reserve for the kernel and
  # the page cache of a spill. 384m was sized before the engine was embedded
  # (its measured cgroup peak alone was 344 MiB), and 768m could not hold two
  # children once the budget they actually need was measured: TestSandboxBudget-
  # FitsContainer sums exactly these terms and fails if it does not fit.
  mem_limit: 1024m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - edge
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

x-agentray-web: &agentray-web-svc
  image: asia-southeast1-docker.pkg.dev/lohi-dev-lohi/docker/agentray-web:${AGENTRAY_TAG:-latest-dev}
  restart: unless-stopped
  mem_limit: 384m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - edge

services:
  # DuckDB is a single-writer embedded database, so each colour owns its own
  # file on its own volume — a shared file would lock out the incoming colour
  # and a shared volume would corrupt it. Each colour also gets its own
  # JetStream durable (INGEST_DURABLE) so both receive every event while both
  # run; a fresh colour replays the stream's retention window on first boot.
  agentray-api-blue:
    <<: *agentray-api-svc
    container_name: dev-agentray-api-blue
    environment:
      DUCKDB_PATH: /data/agentray.duckdb
      INGEST_DURABLE: agentray-ingestors-dev-blue
      # Declared per colour, not on the x-agentray-api anchor: a service's
      # `environment:` map REPLACES the anchor's (YAML merge keys are shallow),
      # so a limit set up there silently never reaches a container.
      GOMEMLIMIT: 256MiB
    volumes:
      - duckdb-dev-blue:/data

  agentray-api-green:
    <<: *agentray-api-svc
    container_name: dev-agentray-api-green
    environment:
      DUCKDB_PATH: /data/agentray.duckdb
      INGEST_DURABLE: agentray-ingestors-dev-green
      # Declared per colour, not on the x-agentray-api anchor: a service's
      # `environment:` map REPLACES the anchor's (YAML merge keys are shallow),
      # so a limit set up there silently never reaches a container.
      GOMEMLIMIT: 256MiB
    volumes:
      - duckdb-dev-green:/data

  agentray-web-blue:
    <<: *agentray-web-svc
    container_name: dev-agentray-web-blue

  agentray-web-green:
    <<: *agentray-web-svc
    container_name: dev-agentray-web-green

volumes:
  duckdb-dev-blue:
  duckdb-dev-green:

networks:
  edge:
    external: true
