# AgentRay shared infrastructure — ONE instance serves both dev and prod.
# Env separation: Redis DB index (0 / 1) and NATS subject suffix (.dev /
# .prod). Postgres is NOT here — it lives in the existing Cloud SQL instance;
# DuckDB is embedded in the API container, one file per colour (see
# ../dev/docker-compose.yml).
#
# LOG ROTATION IS PER-SERVICE HERE ON PURPOSE. /etc/docker/daemon.json sets the
# same caps as a daemon default, but the daemon only reads it at start and
# dockerd is never restarted on this box (that would drop every container), so
# the default does not reach anything already running. These two are the
# longest-lived containers on the VM — a deploy never recreates them — which
# makes them the ones most able to fill the 30 GB root volume unnoticed. The
# cap has to be declared here, and it only binds once the container is
# recreated.

services:
  redis:
    image: redis:7-alpine
    container_name: agentray-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Only holds rate-limit counters — small and safe to evict.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 128m
    networks:
      - edge
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: agentray-nats
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # -js enables JetStream; -sd persists the durable event stream across restarts
    # so a broker bounce never drops queued events.
    command: ["-js", "-sd", "/data"]
    mem_limit: 256m
    networks:
      - edge
    volumes:
      - nats-data:/data

volumes:
  nats-data:

networks:
  edge:
    external: true
