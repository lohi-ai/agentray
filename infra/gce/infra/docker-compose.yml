# Existing AgentRay Redis/NATS dependencies. App releases do not apply this file.
# Production also uses VM-owned image pins/hardening; inspect those before any
# manual recreation. Postgres lives in Cloud SQL. DuckDB volumes and durables
# are declared per colour in ../../../2server/api.runtime.yaml and api.yaml.
#
# LOG ROTATION IS PER-SERVICE HERE ON PURPOSE. /etc/docker/daemon.json sets the
# same caps as a daemon default, but the daemon only reads it at start and
# dockerd is never restarted on this box (that would drop every container), so
# the default does not reach anything already running. These two are the
# longest-lived containers on the VM — a deploy never recreates them — which
# makes them the ones most able to fill the 30 GB root volume unnoticed. The
# cap has to be declared here, and it only binds once the container is
# recreated.

services:
  redis:
    image: redis:7-alpine
    container_name: agentray-redis
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Only holds rate-limit counters — small and safe to evict.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--tcp-keepalive", "60"]
    mem_limit: 128m
    networks:
      - edge
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: agentray-nats
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Config enables durable JetStream, per-write fsync and loopback health.
    # The existing named volume and private client contract are retained.
    command: ["-c", "/etc/nats/nats.conf"]
    healthcheck:
      test: ["CMD", "wget", "-T", "2", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    mem_limit: 256m
    networks:
      - edge
    volumes:
      - nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro

volumes:
  nats-data:

networks:
  edge:
    external: true
