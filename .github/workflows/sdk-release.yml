# One main run checks SDKs once, then tags/publishes only changed versions.
# Manual retries preserve existing public assets and can finish registry upload.
name: sdk-release
on:
  push:
    branches: [main]
    tags: ['browser-v*', 'server-v*', 'python-v*']
    paths: ['sdk/**', '.github/workflows/sdk*.yml', 'docs/RELEASING-SDK.md']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SDK tag to resume
        required: true
        type: string
      dry_run:
        description: Verify without creating tags or publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      pkg: ${{ steps.plan.outputs.pkg }}
      release: ${{ steps.plan.outputs.release }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Preserve workflow policy for legacy tag retries
        run: |
          cp sdk/scripts/release-plan.mjs "$RUNNER_TEMP/release-plan.mjs"
          cp sdk/scripts/release-plan.test.mjs "$RUNNER_TEMP/release-plan.test.mjs"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test "$RUNNER_TEMP/release-plan.test.mjs"
      - id: plan
        run: node "$RUNNER_TEMP/release-plan.mjs"
        env:
          RELEASE_REF_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'tag' || github.ref_type }}
          RELEASE_REF_NAME: ${{ inputs.tag || github.ref_name }}
          RETRY_PUBLISHED: ${{ github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ github.token }}
  verify:
    needs: plan
    uses: ./.github/workflows/sdk.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      pkg: ${{ needs.plan.outputs.pkg }}
  distribute:
    needs: [plan, verify]
    if: needs.plan.outputs.release == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ matrix.release.tag }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ matrix.release.pkg }}-${{ github.run_id }}
          path: dist
      - name: Create immutable tag after all verification passes
        if: matrix.release.createTag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
      - name: Publish complete release, documentation and download index
        run: |
          git show "$CONTROL_SHA:sdk/scripts/publish-release.mjs" > "$RUNNER_TEMP/publish-release.mjs"
          node "$RUNNER_TEMP/publish-release.mjs"
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
          RELEASE_PLAN: ${{ toJSON(matrix.release) }}
      - name: Publish verified tarball to npm
        if: matrix.release.kind == 'npm' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ matrix.release.name }}
          VERSION: ${{ matrix.release.version }}
          NPM_TAG: ${{ matrix.release.npmTag }}
        run: |
          set -euo pipefail
          if npm view "$PACKAGE_NAME@$VERSION" version > /tmp/registry-version.txt 2> /tmp/registry-error.txt; then
            echo 'Already published to npm'
          elif grep -q E404 /tmp/registry-error.txt; then
            npm publish ./dist/*.tgz --ignore-scripts --provenance --access public --tag "$NPM_TAG"
          else
            cat /tmp/registry-error.txt >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        if: matrix.release.kind == 'pypi' && env.PYPI_TOKEN != ''
        with:
          python-version: '3.9'
      - name: Publish verified wheel and sdist to PyPI
        if: matrix.release.kind == 'pypi' && env.PYPI_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install twine
          twine upload --skip-existing dist/*.whl dist/agentray-[0-9]*.tar.gz
      - name: Registry configuration summary
        if: (matrix.release.kind == 'npm' && env.NPM_TOKEN == '') || (matrix.release.kind == 'pypi' && env.PYPI_TOKEN == '')
        run: echo 'Published to GitHub Releases. Add the package registry token and dispatch this tag to finish optional npm/PyPI publication.' >> "$GITHUB_STEP_SUMMARY"
