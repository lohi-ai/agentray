# Builds and tests the published SDKs on every change to them.
#
# Three of them, not four: sdk/swift is a submodule of lohi-ai/agentray-swift,
# which builds, tests and releases itself. Nothing here checks it out.
#
# The `verify-*` steps are not ceremony. The Python wheel shipped for months
# able to build, upload, and pass `twine check` while containing no package code
# at all — a .gitignore pattern re-anchored by the build backend excluded it, and
# nothing between `git push` and `pip install` looked inside the artefact. So
# each job asserts on the contents of the thing that would actually be
# published, not just that a build command exited 0.
#
# Those assertions live in sdk/scripts/ rather than inline here, because
# sdk-release.yml calls this workflow and publishes its verified artifacts. A
# release gate that is weaker than the PR gate is not a gate.
name: sdk

on:
  push:
    # Branches only. A bare `on: push` also fires for tag pushes, which would
    # duplicate every check here — sdk-release.yml owns main and tag checks.
    branches-ignore: [main]
    paths: ['sdk/**', '.github/workflows/sdk.yml', '.github/workflows/sdk-release.yml']
  pull_request:
    paths: ['sdk/**', '.github/workflows/sdk.yml', '.github/workflows/sdk-release.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      pkg:
        default: all
        type: string

permissions:
  contents: read

jobs:
  npm:
    if: inputs.pkg != 'python'
    name: ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON((inputs.pkg == 'browser' && '["browser"]') || (inputs.pkg == 'server' && '["server"]') || '["browser","server"]') }}
    defaults:
      run:
        working-directory: sdk/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/${{ matrix.pkg }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: the tarball contains the built entrypoints
        run: node ../scripts/verify-npm-tarball.mjs
      - name: the global attaches and captures
        if: matrix.pkg == 'browser'
        run: node ../scripts/verify-cdn-bundle.mjs
      - name: Pack once and verify a clean consumer
        run: |
          npm pack --ignore-scripts
          node ../scripts/verify-consumer-install.mjs ./*.tgz
      - name: Include browser script distribution
        if: matrix.pkg == 'browser'
        run: cp dist/index.global.js "agentray-browser-$(node -p 'require("./package.json").version').min.js"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.pkg }}-${{ github.run_id }}
          path: |
            sdk/${{ matrix.pkg }}/*.tgz
            sdk/${{ matrix.pkg }}/*.min.js
          if-no-files-found: error
          overwrite: true

  python:
    if: inputs.pkg == '' || inputs.pkg == 'all' || inputs.pkg == 'python'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      # The client imports urllib3 — the package's own declared dependency. Install
      # from pyproject rather than naming it here, so the two cannot drift.
      - run: pip install -e .
      - run: python tests/test_client.py
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: the wheel contains the package, not just metadata
        run: python ../scripts/verify-python-wheel.py
      - name: the built wheel imports from a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "import agentray; assert agentray.DEFAULT_PLATFORM == 'server'; print('import ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-python-${{ github.run_id }}
          path: sdk/python/dist/*
          if-no-files-found: error
          overwrite: true

  # GitHub's macOS runners still ship bash 3.2, which parses some constructs
  # differently from the bash 5 on the Linux runners — a heredoc inside a command
  # substitution most notably. That difference took down the first Swift release
  # after the npm and Python jobs had gone green on the same construct. Nothing
  # runs a workflow until it is triggered, so this parses every run block here
  # instead, on the PR that writes it.
  workflow-shell:
    name: run blocks parse on a runner
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: pip3 install --quiet --break-system-packages pyyaml || pip3 install --quiet pyyaml
      - run: python3 sdk/scripts/check-workflow-shell.py

  # Every release tag is parsed by the same script the release workflow uses, so
  # a typo'd package name or a manifest that has drifted from its tag fails
  # here — on the PR that caused it — rather than on the tag push.
  tag-contract:
    name: release tags still resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: if [ -f sdk/scripts/release-plan.test.mjs ]; then node --test sdk/scripts/release-plan.test.mjs sdk/scripts/publish-release.test.mjs; fi
      - name: the current manifests would release cleanly
        run: |
          for pkg in browser server python; do
            case $pkg in
              browser|server) v=$(node -p "require('./sdk/$pkg/package.json').version") ;;
              python)  v=$(grep -m1 '^version' sdk/python/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/') ;;
            esac
            node sdk/scripts/resolve-tag.mjs "$pkg-v$v"
          done
